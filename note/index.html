<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>내 필기 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceff3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="필기 노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  /* 종이가 주인공: 회색 책상 위 흰 종이, 도구는 위쪽에. 강조색은 잉크 파랑 하나 */
  --bg:#eceff3; --card:#ffffff; --fill:#f1f3f6; --ink:#191f28; --sub:#6b7684; --faint:#aab2bb; --line:#e3e7ec;
  --accent:#2f6fed; --accent-soft:#e7efff; --on-accent:#ffffff; --red:#e5484d; --paper:#ffffff;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --card:#1c1f25; --fill:#272b33; --ink:#f2f4f6; --sub:#9aa4b1; --faint:#5f6975; --line:#2c3038;
    --accent:#6b9bff; --accent-soft:#1b2a47; --on-accent:#0b1730; --red:#ff6b70; --paper:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --card:#1c1f25; --fill:#272b33; --ink:#f2f4f6; --sub:#9aa4b1; --faint:#5f6975; --line:#2c3038;
  --accent:#6b9bff; --accent-soft:#1b2a47; --on-accent:#0b1730; --red:#ff6b70; --paper:#ffffff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button:active{opacity:.55}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column}
/* 목록 */
.libhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px}
.libhead h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.03em}
.libbody{flex:1;overflow-y:auto;padding:4px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.nbwrap{position:relative;min-width:0}
.nb{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;width:100%}
.nb .cover{aspect-ratio:1000/1414;background:var(--paper);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.12),0 6px 16px rgba(20,30,50,.08);border-left:8px solid var(--accent)}
.nb .cover img{width:100%;height:100%;object-fit:cover;display:block}
.nb b{font-weight:700;font-size:15px;overflow-wrap:anywhere;display:block}
.nb small{color:var(--sub);font-size:12.5px;display:block}
.nbmore{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#191f28;font-weight:800;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.empty{color:var(--sub);padding:40px 0;text-align:center}
.warn{background:var(--card);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--sub);margin-bottom:14px}
/* 버튼 */
.btn{appearance:none;border:0;background:var(--fill);border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;flex:none}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn.danger{color:var(--red)}
.btn.grow{flex:1 1 120px}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* 편집기 위쪽 세 줄: 노트 / 도구 / 고른 도구의 설정 */
.bar{display:flex;align-items:center;gap:6px;background:var(--card);overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar.top{padding:4px 10px 0}
.bar.tools{gap:2px;padding:0 10px}
#opts{gap:6px;padding:2px 12px 6px;min-height:46px;border-bottom:1px solid var(--line)}
.title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;background:none;border:0;padding:8px 6px;cursor:pointer;min-height:44px;flex:0 1 auto}
.tool{appearance:none;border:0;background:none;border-radius:12px;min-width:48px;height:50px;padding:4px 4px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer;flex:none}
.tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.tool:disabled{opacity:.35}
.bar.top .tool{height:46px}
.sep{flex:none;width:1px;height:28px;background:var(--line);margin:0 5px}
.grow1{flex:1}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--accent)}
.sz{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:var(--fill);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true]{background:var(--accent-soft)} .sz[aria-pressed=true] i{background:var(--accent)}
.stat{flex:none;font-size:12.5px;color:var(--sub);white-space:nowrap}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;min-height:40px;flex:none;display:inline-flex;align-items:center;gap:5px}
.chip.sm{min-height:36px;padding:5px 11px;font-size:13.5px}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.step{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:13.5px;font-weight:700;color:var(--sub)}
.step button{width:34px;height:34px;border-radius:10px;border:0;background:var(--fill);font-weight:800;font-size:17px;cursor:pointer;color:var(--ink)}
.step i{font-style:normal;min-width:22px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
/* 종이: 한 화면에 한 쪽, 옆으로 넘긴다 */
#scroller{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-x pan-y}
#scroller::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;overflow:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:14px 16px 110px}
#scroller.lock,#scroller.lock .slide{overflow:hidden}
.page{position:relative;width:var(--pw);height:calc(var(--pw) * 1.414);margin:0 auto;background-color:var(--paper);border-radius:4px;box-shadow:0 1px 2px rgba(20,30,50,.12),0 4px 14px rgba(20,30,50,.08);touch-action:pan-x pan-y;overflow:hidden}
.ghostpage{background:none;box-shadow:none;border:2px dashed var(--faint);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--sub);font-weight:700;font-size:17px;line-height:1.6}
.paper-lined{background-image:linear-gradient(to bottom,transparent calc(100% - 1px),#d7dde5 calc(100% - 1px));background-size:100% calc(var(--pw) * .045)}
.paper-grid{background-image:linear-gradient(#e1e6ec 1px,transparent 1px),linear-gradient(90deg,#e1e6ec 1px,transparent 1px);background-size:calc(var(--pw) * .04) calc(var(--pw) * .04)}
.paper-dot{background-image:radial-gradient(#bcc5d0 1.3px,transparent 1.5px);background-size:calc(var(--pw) * .04) calc(var(--pw) * .04)}
.page canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.page .ink{z-index:1}
#live{z-index:3;pointer-events:none}
.texts{position:absolute;inset:0;z-index:2;pointer-events:none}
.tx{position:absolute;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;outline:none;min-height:1.4em;min-width:2em;color:#191f28;-webkit-user-select:text;user-select:text;border-radius:3px}
body.t-text .tx{pointer-events:auto;box-shadow:0 0 0 1px rgba(47,111,237,.25)}
body.t-text .tx:focus{box-shadow:0 0 0 2px #2f6fed}
.pno{position:absolute;right:10px;bottom:6px;z-index:2;font-size:11px;color:#aab2bb;pointer-events:none}
.selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(10,20,40,.25);padding:8px;display:flex;gap:6px;z-index:15;max-width:calc(100% - 24px);overflow-x:auto}
/* 시트 */
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px 26px;-webkit-user-select:text;user-select:text}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.panel h2{font-size:19px;font-weight:800;margin:0;letter-spacing:-.02em}
.f{display:flex;flex-direction:column;gap:5px;margin-top:14px}
.f label{font-size:13px;color:var(--sub);font-weight:600}
.f input,.f textarea{border:0;background:var(--fill);border-radius:12px;padding:12px 14px;min-height:48px;width:100%;font-size:16px}
.f textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.menu{display:flex;flex-direction:column;margin-top:6px}
.menu button{appearance:none;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:14px 4px;font-size:16px;font-weight:600;cursor:pointer;min-height:52px}
.menu button:first-child{border-top:0}
.menu small{display:block;font-weight:400;color:var(--sub);font-size:13px}
.shot{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px;background:#fff}
.answer{margin-top:12px;background:var(--fill);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;min-height:48px}
.tiny{font-size:12.5px;color:var(--sub);margin:8px 0 0}
.toast{position:fixed;left:50%;top:162px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
#typer{position:absolute;z-index:4;margin:0;padding:0;border:0;border-radius:3px;background:rgba(255,255,255,.92);box-shadow:0 0 0 2px #2f6fed;outline:none;resize:none;overflow:hidden;font-family:inherit;line-height:1.4;min-height:1.4em;color:#191f28;pointer-events:auto;-webkit-user-select:text;user-select:text;touch-action:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.pastebox{margin-top:12px;border:2px dashed var(--faint);border-radius:12px;min-height:84px;padding:14px;color:var(--ink);font-size:15px;-webkit-user-select:text;user-select:text;outline:none;-webkit-touch-callout:default}
.pastebox:empty::before{content:"여기를 길게 눌러 붙여넣기";color:var(--sub)}
.pastebox:focus{border-color:var(--accent)}
.pastebox img{max-width:100%;max-height:120px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.swnone{flex:none;height:30px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:12.5px;font-weight:700;cursor:pointer}
.swnone[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#pastebub{position:fixed;z-index:25;min-width:176px;min-height:46px;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--card);font-size:15px;font-weight:700;text-align:center;outline:none;caret-color:transparent;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;box-shadow:0 6px 24px rgba(10,20,40,.3);white-space:nowrap;overflow:hidden;cursor:pointer}
#pastebub:empty::before{content:"여기를 눌러 붙여넣기"}
#pastebub img{max-height:40px}
@media (max-width:1000px){#opts .chip.ico .lbl{display:none}#opts .chip.ico{padding:5px 9px}}
#catcher{position:fixed;z-index:12;width:90px;height:90px;opacity:0;outline:none;overflow:hidden;font-size:16px;color:transparent;caret-color:transparent;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.navb{appearance:none;flex:none;width:34px;height:40px;border:0;border-radius:10px;background:none;color:var(--sub);font-size:22px;font-weight:700;line-height:1;cursor:pointer}
.navb:disabled{opacity:.3}
.libbtns{display:flex;gap:8px}
@media (max-width:600px){#stat{display:none}.title{max-width:26vw}.bar.top .tool{min-width:42px}.libhead h1{font-size:22px}}
#holdring{position:fixed;z-index:24;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid var(--accent);background:rgba(47,111,237,.12);pointer-events:none}
.steps{margin:10px 0 0;padding-left:22px;font-size:14.5px;line-height:1.75}
.steps a{color:var(--accent);font-weight:700}
.kv{margin:10px 0 0;font-size:14.5px;line-height:1.8}
.kv b{font-weight:700}
</style>
</head>
<body>

<div class="screen" id="lib">
  <div class="libhead"><h1>내 노트</h1><div class="libbtns"><button type="button" class="btn" data-act="sync-sheet" id="syncbtn" hidden>기기 연동</button><button type="button" class="btn" data-act="lib-retry">새로 고침</button><button type="button" class="btn pri" data-act="nb-new">새 노트</button></div></div>
  <div class="libbody"><div class="warn" id="libwarn" hidden></div><div id="grid" class="grid"><div class="empty">노트를 불러오는 중이에요</div></div></div>
</div>

<div class="screen" id="ed" hidden>
  <div class="bar top" id="bar">
    <button type="button" class="tool" data-act="back" aria-label="노트 목록으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>목록</button>
    <button type="button" class="title" id="title" data-act="rename"></button>
    <span class="grow1"></span>
    <button type="button" class="navb" data-act="pg-prev" id="pgprev" aria-label="앞쪽으로">‹</button><span class="stat" id="pageno"></span><button type="button" class="navb" data-act="pg-next" id="pgnext" aria-label="다음 쪽으로">›</button>
    <span class="stat" id="stat"></span>
    <button type="button" class="tool" data-act="save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>저장</button>
    <button type="button" class="tool" data-act="export"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v5h14v-5"/></svg>내보내기</button>
    <button type="button" class="tool" data-act="more" aria-label="더 보기"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>더 보기</button>
  </div>
  <div class="bar tools" id="tools">
    <button type="button" class="tool" data-tool="pencil"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3M4 20l2-1"/></svg>연필</button>
    <button type="button" class="tool" data-tool="brush"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-8 8c-2 2-5 2-8 2 0-3 0-6 2-8z"/><path d="M11 7l6 6"/></svg>브러쉬</button>
    <button type="button" class="tool" data-tool="hl"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3h5l1-1"/><path d="M9 15l7-10 4 3-7 10z"/><path d="M4 21h16"/></svg>형광펜</button>
    <button type="button" class="tool" data-tool="eraser"><svg viewBox="0 0 24 24"><path d="M8 19l-4-4a2 2 0 0 1 0-2l9-9a2 2 0 0 1 2 0l5 5a2 2 0 0 1 0 2l-8 8z"/><path d="M8 19h12M9 9l6 6"/></svg>지우개</button>
    <span class="sep"></span>
    <button type="button" class="tool" data-tool="select"><svg viewBox="0 0 24 24"><path d="M5 9V6a1 1 0 0 1 1-1h3M15 5h3a1 1 0 0 1 1 1v3M19 15v3a1 1 0 0 1-1 1h-3M9 19H6a1 1 0 0 1-1-1v-3"/></svg>선택</button>
    <button type="button" class="tool" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6V5h14v1M12 5v14M9 19h6"/></svg>타이핑</button>
    <button type="button" class="tool" data-tool="shape"><svg viewBox="0 0 24 24"><rect x="3" y="10" width="11" height="11" rx="1"/><circle cx="16" cy="8" r="5"/></svg>도형</button>
    <button type="button" class="tool" data-tool="table"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>표</button>
    <label class="tool filebtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>사진<input type="file" accept="image/*" id="photo-in" aria-label="사진 넣기"></label>
    <span class="sep"></span>
    <button type="button" class="tool" data-act="undo" id="undo" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg>되돌리기</button>
    <button type="button" class="tool" data-act="redo" id="redo" aria-label="다시 하기"><svg viewBox="0 0 24 24"><path d="M15 6l5 5-5 5"/><path d="M20 11H10a5 5 0 0 0 0 10h3"/></svg>다시</button>
  </div>
  <div class="bar" id="opts"></div>
  <div id="scroller"></div>
</div>

<div class="selbar" id="selbar" hidden>
  <button type="button" class="btn sm pri" data-act="sel-ask">AI에게 묻기</button>
  <button type="button" class="btn sm" data-act="sel-text">글자로 바꾸기</button>
  <button type="button" class="btn sm" data-act="sel-copy">복사</button>
  <button type="button" class="btn sm danger" data-act="sel-del">지우기</button>
  <button type="button" class="btn sm" data-act="sel-clear">선택 풀기</button>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <header><h2 id="sheetTitle"></h2><button type="button" class="btn sm" data-act="close">닫기</button></header>
  <div id="sheetBody"></div>
</div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidN=0;
const uid=()=>Date.now().toString(36)+(uidN++%1296).toString(36)+Math.random().toString(36).slice(2,5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const within=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
const PW=1000,PH=1414;
const COLORS=['#191f28','#2f6fed','#e5484d','#009472','#f08c00','#7c4dff'];
const HL_COLORS=['#ffe066','#8ce99a','#74c0fc','#ffa8a8','#eebefa','#ffc078'];
const SIZES={pencil:[2.4,3.4,5],pen:[2,3.2,5],brush:[6,11,18],hl:[18,28,40],eraser:[8,16,30],text:[18,24,34],shape:[2,3.4,6],table:[1.6,2.6,4]};

/* ───────── 저장소: 클라우드(db)가 있으면 그쪽, 없으면 이 기기(IndexedDB) ───────── */
const Store={mode:'loading',db:null,idb:null,q:{},
  async init(){
    let db=null;
    try{ if(window.claude&&typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){db=null;}
    if(db){ /* 이 화면에서 아예 못 쓰는 경우에만 기기 저장으로 내려간다. 잠깐 끊긴 것은 목록에서 다시 불러오게 한다 */
      try{await within(db.collection('nb').limit(1).get(),10000);}
      catch(e){if(e&&['not_granted','capability_disabled','capability_removed','revoked'].indexOf(e.code)>=0)db=null;}
    }
    if(db){this.db=db;this.mode='cloud';return;}
    try{
      this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('note-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
      this.mode='local';
    }catch(e){this.mode='memory';this.mem={};}
  },
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.idb.transaction('kv',mode),s=t.objectStore('kv');const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});},
  /* 같은 문서에는 한 번에 하나씩만 쓴다 */
  chain(path,fn){const p=(this.q[path]||Promise.resolve()).catch(()=>{}).then(fn);this.q[path]=p;return p;},
  async get(path){
    if(this.mode==='cloud'){const s=await this.db.doc(path).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null;}
    if(this.mode==='local'){const v=await this.tx('readonly',s=>s.get(path));return v===undefined?null:v;}
    return this.mem[path]||null;},
  set(path,data,silent){if(!silent)Sync.mark(path);return this.chain(path,async()=>{
    if(this.mode==='cloud')await this.db.doc(path).set(data);
    else if(this.mode==='local')await this.tx('readwrite',s=>s.put(data,path));
    else this.mem[path]=JSON.parse(JSON.stringify(data));});},
  del(path,silent){if(!silent)Sync.mark(path);return this.chain(path,async()=>{
    if(this.mode==='cloud')await this.db.doc(path).delete();
    else if(this.mode==='local')await this.tx('readwrite',s=>s.delete(path));
    else delete this.mem[path];});},
  /* 연동 상태처럼 노트가 아닌 자료(이 기기에서만 쓴다) */
  async meta(k){if(this.mode!=='local')return null;const v=await this.tx('readonly',s=>s.get('~sync/'+k));return v===undefined?null:v;},
  metaSet(k,v){if(this.mode!=='local')return Promise.resolve();return this.tx('readwrite',s=>s.put(v,'~sync/'+k));},
  async allKeys(){if(this.mode!=='local')return [];const ks=await this.tx('readonly',s=>s.getAllKeys());return ks.filter(k=>String(k).charAt(0)!=='~');},
  watch(path,cb){
    if(this.mode!=='cloud')return null;
    try{const ref=this.db.doc(path);if(typeof ref.onSnapshot!=='function')return null;
      return ref.onSnapshot(sn=>{try{cb(sn.exists?sn.data():null);}catch(e){}},()=>{});}catch(e){return null;}
  },
  async list(col){
    if(this.mode==='cloud'){const q=await this.db.collection(col).limit(1000).get();return q.docs.map(d=>({id:d.id,data:JSON.parse(JSON.stringify(d.data()))}));}
    const pre=col+'/',depth=pre.split('/').length;
    if(this.mode==='local'){
      const range=IDBKeyRange.bound(pre,pre+String.fromCharCode(0xffff));
      const keys=await this.tx('readonly',s=>s.getAllKeys(range)),vals=await this.tx('readonly',s=>s.getAll(range));
      return keys.map((k,i)=>({id:k.slice(pre.length),data:vals[i],k})).filter(x=>x.k.split('/').length===depth);}
    return Object.keys(this.mem).filter(k=>k.startsWith(pre)&&k.split('/').length===depth).map(k=>({id:k.slice(pre.length),data:this.mem[k]}));}
};

const enc=s=>{const o={i:s.id,t:s.t,c:s.c,w:s.w,d:Array.from(s.p,(v,j)=>j%3===2?Math.round(v*100):Math.round(v*10))};if(s.g)o.g=1;if(s.f)o.f=s.f;return o;};

function bbox(s){if(s.b)return s.b;let a=1e9,b=1e9,c=-1e9,d=-1e9;const p=s.p;for(let i=0;i<p.length;i+=3){if(p[i]<a)a=p[i];if(p[i]>c)c=p[i];if(p[i+1]<b)b=p[i+1];if(p[i+1]>d)d=p[i+1];}return s.b=[a,b,c,d];}
/* 펜은 굵기가 거의 일정하고, 브러쉬는 누르는 힘에 따라 크게 달라진다 */
const widthAt=(s,pr)=>s.t==='m'?s.w*(0.12+1.5*pr):s.w*(0.85+0.3*pr);
/* 연필 질감: 색을 입힌 알갱이 무늬 */
const GRAIN={},PAT=new WeakMap();
function grain(color){
  if(GRAIN[color])return GRAIN[color];
  const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),im=x.createImageData(96,96),d=im.data;
  const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);let seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  for(let i=0;i<d.length;i+=4){let a=0.58+0.42*rnd();if(rnd()<0.2)a*=0.25;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=Math.round(a*255);}

function pencilStyle(ctx,color){let m=PAT.get(ctx);if(!m){m=new Map();PAT.set(ctx,m);}let p=m.get(color);if(!p){p=ctx.createPattern(grain(color),'repeat');m.set(color,p);}return p||color;}
/* 한 번에 이어 그리는 길 */
function trace(ctx,s,k,dx,dy){
  const p=s.p,n=p.length/3,X=i=>(p[i*3]+dx)*k,Y=i=>(p[i*3+1]+dy)*k;
  ctx.beginPath();ctx.moveTo(X(0),Y(0));
  if(n===1){ctx.lineTo(X(0)+0.01,Y(0));return;}
  if(s.g){for(let i=1;i<n;i++)ctx.lineTo(X(i),Y(i));return;}
  for(let i=1;i<n;i++){const mx=i<n-1?(X(i)+X(i+1))/2:X(i),my=i<n-1?(Y(i)+Y(i+1))/2:Y(i);ctx.quadraticCurveTo(X(i),Y(i),mx,my);}
}
function drawStroke(ctx,s,k,dx,dy){
  dx=dx||0;dy=dy||0;const p=s.p,n=p.length/3;if(!n)return;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.c;ctx.fillStyle=s.c;
  if(s.t==='h'){ctx.save();ctx.globalAlpha=0.4;ctx.globalCompositeOperation='multiply';ctx.lineWidth=s.w*k;ctx.lineCap='butt';trace(ctx,s,k,dx,dy);ctx.stroke();ctx.restore();return;}

  if(s.g){ctx.lineWidth=Math.max(0.6,s.w*k);trace(ctx,s,k,dx,dy);ctx.stroke();return;}
  const X=i=>(p[i*3]+dx)*k,Y=i=>(p[i*3+1]+dy)*k;
  if(n===1){ctx.beginPath();ctx.arc(X(0),Y(0),Math.max(0.5,widthAt(s,p[2])*k/2),0,Math.PI*2);ctx.fill();return;}
  let px=X(0),py=Y(0);
  for(let i=1;i<n;i++){

    ctx.lineWidth=Math.max(0.6,widthAt(s,(p[i*3-1]+p[i*3+2])/2)*k);
    ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(X(i),Y(i),mx,my);ctx.stroke();px=mx;py=my;}
}
function drawPaper(ctx,paper,k){
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,PW*k,PH*k);
  if(paper==='lined'){ctx.strokeStyle='#d7dde5';ctx.lineWidth=Math.max(1,k);ctx.beginPath();for(let y=45;y<PH;y+=45){ctx.moveTo(0,y*k);ctx.lineTo(PW*k,y*k);}ctx.stroke();}

/* 종이에 올라가는 순서: 사진 → 채운 색 → 표 → 필기. 그래서 사진과 색 위에 글씨가 항상 보인다 */

    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,o.x*k,o.y*k,o.w*k,o.h*k);else{ctx.fillStyle='#eef1f4';ctx.fillRect(o.x*k,o.y*k,o.w*k,o.h*k);}}

/* ───────── 저장 ───────── */
function firstEdit(){if(!edited){edited=true;dirty.meta=true;}}

/* 쓰다가 1.2초 쉬면 저장. 쉬지 않고 계속 써도 5초마다 한 번은 저장 */

async function doFlush(){

/* 사진은 한 문서에 다 못 담으니 여러 조각으로 나눠 저장한다 */

async function loadPage(pid){

  P.loading=(async()=>{
    try{
      const meta=await Store.get('pg/'+pid),chunks=await Store.list('pg/'+pid+'/s');
      chunks.sort((a,b)=>(+a.id)-(+b.id));const strokes=[];P.ksz=[];
      for(const ch of chunks){const k=+ch.id;for(const o of (ch.data.d||[])){const s=dec(o,k);strokes.push(s);P.ksz[k]=(P.ksz[k]||0)+s.p.length*6+80;}}

      P.kn=Math.max((meta&&meta.kn)||0,chunks.length?(+chunks[chunks.length-1].id)+1:0);
      const used=new Set(P.objs.filter(o=>o.k==='img').map(o=>o.id));

        const docs=await Store.list('pg/'+pid+'/i'),by={},jobs=[];
        for(const d of docs){const m=d.id.lastIndexOf('-'),id=d.id.slice(0,m);(by[id]=by[id]||[])[+d.id.slice(m+1)]=d.data.d;}

          else for(let j=0;j<by[id].length;j++)Store.del('pg/'+pid+'/i/'+id+'-'+j).catch(()=>{});}   /* 지워진 사진의 남은 조각 정리 */

}

function liveStroke(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!DRAW)return;if(DRAW.s)paintLive();else if(DRAW.shape)paintShape();});}
/* 쓰는 동안에는 새로 생긴 부분만 덧그린다(획이 길어져도 느려지지 않게). 손을 떼면 종이에 깨끗하게 다시 그린다 */

/* 끌어서 만든 네모 안에 도형이나 표의 선들을 만든다 */
function genShape(D){

/* ───────── 지우개: 닿은 부분만 잘라 낸다(획 전체 지우기도 고를 수 있다) ───────── */

function makePdf(imgs){ /* JPEG 그림 한 장이 한 쪽인 PDF를 직접 만든다 */
  const te=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const b=typeof d==='string'?te.encode(d):d;parts.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n');body();push('\nendobj\n');};
  push('%'+'PDF-1.4\n%'+String.fromCharCode(0xe2,0xe3,0xcf,0xd3)+'\n');
  const N=imgs.length,kids=[];for(let i=0;i<N;i++)kids.push((3+i*3)+' 0 R');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Count '+N+' /Kids ['+kids.join(' ')+'] >>'));
  imgs.forEach((im,i)=>{const pg=3+i*3,ct=pg+1,xo=pg+2,W=595.28,H=841.89,stream='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    obj(pg,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+xo+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    obj(ct,()=>push('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'));
    obj(xo,()=>{push('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.data.length+' >>\nstream\n');push(im.data);push('\nendstream');});});
  const xref=len,cnt=3+N*3;let x='xref\n0 '+cnt+'\n0000000000 65535 f \n';
  for(let n=1;n<cnt;n++)x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}

/* ───────── 기기 연동(따로 설치해 쓰는 앱) ─────────
   노트는 먼저 이 기기에 저장하고, 내 GitHub 비공개 저장소(data/…json)와 뒤에서 맞춘다.
   올리기: 바뀐 문서만 하나씩. 받기: 저장소의 파일 목록을 한 번에 받아 달라진 것만 내려받는다. 같은 문서를 양쪽에서 고쳤으면 나중에 올린 쪽이 남는다. */
const GH='https://api.github.com';
const b64enc=str=>{const u=new TextEncoder().encode(str);let o='';for(let i=0;i<u.length;i+=0x8000)o+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(o);};

const Sync={on:false,cfg:null,shas:{},pending:{},head:'',busy:false,again:false,timer:0,poll:0,mt:0,last:0,err:'',note:'',
  load(){try{this.cfg=JSON.parse(localStorage.getItem('note-gh')||'null');}catch(e){this.cfg=null;}return this.cfg&&this.cfg.token&&this.cfg.repo?this.cfg:null;},
  label(){return this.err?'연동 안 됨':(this.busy||Object.keys(this.pending).length?'연동 중…':'연동됨');},
  status(note){this.note=note||'';const b=$('#syncbtn');if(b)b.textContent=this.on?this.label():'기기 연동';setStat();const n=$('#sync-now');if(n)n.textContent=this.busy?(this.note||'맞추는 중…'):'지금 맞추기';},
  async api(method,url,body){

    return j;},
  saveMeta(){clearTimeout(this.mt);this.mt=setTimeout(()=>{Store.metaSet('shas',this.shas).catch(()=>{});Store.metaSet('pending',this.pending).catch(()=>{});},300);},
  mark(path){
    if(!this.on||path.indexOf('rev/')===0)return;
    this.pending[path]=(this.pending[path]||0)+1;this.saveMeta();clearTimeout(this.timer);this.timer=setTimeout(()=>this.cycle(),2500);this.status();},
  async begin(first){
    if(Store.mode!=='local'||!this.load())return;
    this.on=true;this.err='';this.shas=(await Store.meta('shas'))||{};this.pending=(await Store.meta('pending'))||{};this.status();
    clearInterval(this.poll);this.poll=setInterval(()=>{if(!document.hidden&&navigator.onLine!==false)this.cycle(true);},20000);
    await this.cycle(false,first);},
  stop(){this.on=false;clearInterval(this.poll);clearTimeout(this.timer);this.shas={};this.pending={};this.head='';this.err='';
    try{localStorage.removeItem('note-gh');}catch(e){}Store.metaSet('shas',{}).catch(()=>{});Store.metaSet('pending',{}).catch(()=>{});this.cfg=null;this.status();},
  /* light: 저장소가 바뀌었는지만 가볍게 보고, 바뀌었을 때만 받는다 */
  async cycle(light,first){
    if(!this.on)return;if(this.busy){this.again=true;return;}
    this.busy=true;this.status();
    try{
      const R='/repos/'+this.cfg.repo,pend=Object.keys(this.pending).length>0;let need=!light||pend||first;
      const headNow=async()=>{try{const c=await this.api('GET',R+'/commits?per_page=1&sha='+encodeURIComponent(this.cfg.branch));return (c&&c[0]&&c[0].sha)||'';}catch(e){if(e.status===409||e.status===404)return '';throw e;}};
      if(!need){const h=await headNow();if(h!==this.head)need=true;}
      if(need){
        await this.pull();
        if(first){for(const k of await Store.allKeys())if(!(k in this.shas)&&k.indexOf('rev/')!==0)this.pending[k]=(this.pending[k]||0)+1;}   /* 이 기기에만 있던 노트도 올린다 */
        await this.push();this.head=await headNow();}

    }catch(e){this.err=e&&e.status===401?'토큰이 맞지 않아요. 연동을 끊고 새 토큰으로 다시 연결해 주세요':e&&e.status===404?'보관 저장소를 찾지 못했어요':e&&e.status===403?'GitHub가 잠시 요청을 막았어요. 조금 뒤에 다시 맞춰져요':'인터넷 연결을 확인해 주세요. 노트는 이 기기에 안전하게 저장돼 있어요';}

  async pull(){

    for(const p of todo){   /* 쪽·필기 조각을 먼저, 노트 정보는 마지막에(노트가 없는 쪽을 가리키지 않게) */
      const b=await this.api('GET',R+'/git/blobs/'+remote[p]);await Store.set(p,JSON.parse(b64dec(b.content)),true);this.shas[p]=remote[p];changed.push(p);

  /* 양쪽에서 고친 문서 합치기: 획·글·사진·표·쪽은 id로 견주어 양쪽 것을 모두 남긴다(같은 id는 이 기기 것을 쓴다) */
  merge(p,local,remote){

      const put=async sha=>{

};
/* 다른 기기에서 바뀐 것이 내려왔을 때 화면에 반영 */

/* ───────── 여러 기기에서 같은 노트 쓰기 ─────────

const fingers=e=>Array.from(e.touches).filter(t=>t.touchType!=='stylus');

sc.addEventListener('touchstart',e=>{
  if(e.target===typer)return;
  let pen=false;for(const t of e.changedTouches)if(t.touchType==='stylus'||(t.touchType===undefined&&performance.now()-lastPenT<150))pen=true;   /* 갤럭시 S펜은 touchType이 없어서 방금 펜이 닿았는지로 안다 */

    if(DRAW&&DRAW.touch&&(!DRAW.s||DRAW.s.p.length<=36)){DRAW=null;clearLive();lock(false);if(SEL&&SEL.dragging){SEL=null;drawSel();}}   /* 한 손가락 쓰기 중 두 번째 손가락: 방금 찍힌 점은 버린다 */
    if(!DRAW){const m=mid(f);PINCH={d0:gap(f)||1,z0:S.zoom,mx:m[0],my:m[1],sx:m[0],sy:m[1],ratio:1};e.preventDefault();return;}
  }
  const pg=e.target.closest('.page');

},{passive:false});

  if(Math.abs(g.ratio-1)<0.12&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4&&S.zoom<=1.02)flip(dx<0?1:-1);

let wheelT=0;
sc.addEventListener('wheel',e=>{if(!e.ctrlKey||!NB)return;e.preventDefault();zoomAt(S.zoom*Math.exp(-e.deltaY*0.01),e.clientX,e.clientY);clearTimeout(wheelT);wheelT=setTimeout(zoomDone,160);},{passive:false});
