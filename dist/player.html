<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#wrap{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}.err{color:#fff;font:14px sans-serif;display:grid;place-items:center;height:100%;padding:20px;text-align:center}</style></head><body><div id="wrap"></div><script>(function(){const v=new URLSearchParams(location.search).get('v')||'';const w=document.getElementById('wrap');if(!/^[A-Za-z0-9_-]{6,20}$/.test(v)){w.innerHTML='<div class="err">잘못된 YouTube 영상 주소입니다.</div>';return;}const f=document.createElement('iframe');const q=new URLSearchParams({rel:'0',playsinline:'1',enablejsapi:'1',origin:location.origin});f.src='https://www.youtube.com/embed/'+v+'?'+q;f.title='YouTube video player';f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.referrerPolicy='strict-origin-when-cross-origin';f.allowFullscreen=true;w.appendChild(f);})();</script></body></html>
